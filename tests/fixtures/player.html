<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>YouTube Fit Screen — player fixture</title>
<style>
  body { font: 16px system-ui; background: #202124; color: white; margin: 32px; }
  .html5-video-player { position: relative; width: 800px; height: 450px; background: #000; overflow: hidden; }
  .html5-video-player:fullscreen { width: 100%; height: 100%; }
  .html5-video-container { position: absolute; inset: 0; }
  video { position: absolute; object-fit: contain; }
  .ytp-right-controls { position: absolute; right: 16px; bottom: 12px; display: flex; height: 48px; z-index: 10; }
  .ytp-button { width: 48px; height: 48px; background: #202124bb; border: 0; color: white; cursor: pointer; padding: 0; }
  .ytp-button svg { padding: 8px 12px; }
  .caption { position: absolute; bottom: 80px; left: 35%; width: 30%; text-align: center; z-index: 5; }
</style>
<h1>Fullscreen crop test</h1>
<p>Generated video has colored edges and a circular center marker to expose cropping or stretching.</p>
<div id="movie_player" class="html5-video-player">
  <div class="html5-video-container"><video class="html5-main-video" muted autoplay playsinline></video></div>
  <div class="caption">Captions stay inside the player</div>
  <div class="ytp-right-controls"><button class="ytp-button ytp-fullscreen-button" title="Fullscreen">⛶</button></div>
</div>
<script>
  const player = document.querySelector('#movie_player');
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  let stream;
  window.setVideoSize = (width, height) => {
    canvas.width = width;
    canvas.height = height;
    context.fillStyle = '#196b7a';
    context.fillRect(0, 0, width, height);
    context.fillStyle = '#ee625f';
    context.fillRect(0, 0, width / 8, height);
    context.fillStyle = '#e8bd4c';
    context.fillRect(width * 7 / 8, 0, width / 8, height);
    context.fillStyle = 'white';
    context.beginPath();
    context.arc(width / 2, height / 2, Math.min(width, height) / 5, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = '#152d3d';
    context.font = `${Math.min(width, height) / 14}px system-ui`;
    context.textAlign = 'center';
    context.fillText(`${width} × ${height}`, width / 2, height / 2);
    const video = player.querySelector('video');
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = canvas.captureStream(2);
    video.srcObject = stream;
    video.play();
    window.layoutVideo();
  };
  window.layoutVideo = () => {
    const scale = Math.min(player.clientWidth / canvas.width, player.clientHeight / canvas.height);
    const width = canvas.width * scale;
    const height = canvas.height * scale;
    const video = player.querySelector('video');
    video.style.width = `${width}px`;
    video.style.height = `${height}px`;
    video.style.left = `${(player.clientWidth - width) / 2}px`;
    video.style.top = `${(player.clientHeight - height) / 2}px`;
  };
  // Event delegation also works after controls are replaced, as in YouTube SPA navigation.
  player.addEventListener('click', event => {
    if (event.target.closest('.ytp-fullscreen-button')) {
      if (document.fullscreenElement) document.exitFullscreen();
      else player.requestFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', window.layoutVideo);
  new ResizeObserver(window.layoutVideo).observe(player);
  window.setVideoSize(640, 480);
</script>
</html>
